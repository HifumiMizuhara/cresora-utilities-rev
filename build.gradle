plugins {
	// Minecraft 26.x ships non-obfuscated, so the non-remapping plugin id
	// 'net.fabricmc.fabric-loom' is used and no mappings dependency is required.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and Mojang repositories automatically.
	// Add extra repositories here when depending on other mods.
}

loom {
	// Keeps client-only code out of the dedicated server jar.
	splitEnvironmentSourceSets()

	mods {
		"cresora-utilities" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Technically optional, but virtually always wanted.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Build-time DSL compiler. Lives in its own source set so it never ends up in the mod jar.
sourceSets {
	compiler {
	}
	compilerTest {
		compileClasspath += sourceSets.compiler.output
		runtimeClasspath += sourceSets.compiler.output
	}
}

dependencies {
	compilerImplementation 'com.google.code.gson:gson:2.15.0'
	compilerTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	compilerTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
	compilerTestImplementation.extendsFrom compilerImplementation
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

tasks.register('compilerTest', Test) {
	group = 'cresora'
	description = 'Unit tests for the Cresora weapon DSL compiler'
	testClassesDirs = sourceSets.compilerTest.output.classesDirs
	classpath = sourceSets.compilerTest.runtimeClasspath
	useJUnitPlatform()
}

tasks.named('check') { dependsOn 'compilerTest' }

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Ask Gradle for a Java 25 toolchain; if only a newer JDK is installed the
	// foojay resolver in settings.gradle downloads a matching one.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom attaches the sources jar to the build automatically.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Maven publication, used when publishing to a Maven repository.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Publishing targets go here. Note this is a different block from the
		// top-level repositories, which is used for resolving dependencies.
	}
}
