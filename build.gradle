plugins {
	// Minecraft 26.x ships non-obfuscated, so the non-remapping plugin id
	// 'net.fabricmc.fabric-loom' is used and no mappings dependency is required.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and Mojang repositories automatically.
	// Add extra repositories here when depending on other mods.
}

loom {
	// Keeps client-only code out of the dedicated server jar.
	splitEnvironmentSourceSets()

	mods {
		"cresora-utilities" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Technically optional, but virtually always wanted.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Ask Gradle for a Java 25 toolchain; if only a newer JDK is installed the
	// foojay resolver in settings.gradle downloads a matching one.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom attaches the sources jar to the build automatically.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Maven publication, used when publishing to a Maven repository.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Publishing targets go here. Note this is a different block from the
		// top-level repositories, which is used for resolving dependencies.
	}
}
